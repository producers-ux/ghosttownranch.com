name: Build product pages
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'   # daily, picks up new products, price and stock changes
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-products.mjs
      - name: Commit if changed
        run: |
          git config user.name "gtr-bot"
          git config user.email "bot@ghosttownranch.com"
          git add -A products sitemap.xml
          git diff --cached --quiet || (git commit -m "Rebuild static product pages + sitemap" && git push)
