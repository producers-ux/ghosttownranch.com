name: terr-assets
on:
  push:
    branches: [terr-assets]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[assets]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-terr && cd tmp-terr
          B=https://cdn.shopify.com/s/files/1/0984/0174/7240/files
          while read n f; do curl -sfL "$B/$f?width=1600" -o "$n.jpg"; done < ../terr-list.txt
          ls -la
          cd .. && git config user.name bot && git config user.email bot@users.noreply.github.com && git add tmp-terr && git commit -m "[assets] territories" && git push
